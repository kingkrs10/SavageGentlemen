<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAVAGE PHYSICS</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      font-family: 'Courier Prime', 'Courier New', monospace;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    canvas { display: block; }

    /* HUD Overlay */
    #hud {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    #text-input {
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid #39ff14;
      color: #39ff14;
      font-family: 'Courier Prime', 'Courier New', monospace;
      font-size: 18px;
      padding: 12px 24px;
      width: 400px;
      max-width: 90vw;
      outline: none;
      text-align: center;
      letter-spacing: 2px;
      transition: all 0.3s ease;
      text-transform: uppercase;
    }

    #text-input:focus {
      border-color: #fff;
      box-shadow: 0 0 20px rgba(57, 255, 20, 0.4), inset 0 0 20px rgba(57, 255, 20, 0.05);
    }

    #text-input::placeholder {
      color: rgba(57, 255, 20, 0.4);
      letter-spacing: 3px;
    }

    #engage-btn {
      background: transparent;
      border: 2px solid #39ff14;
      color: #39ff14;
      font-family: 'Courier Prime', 'Courier New', monospace;
      font-size: 14px;
      font-weight: 700;
      padding: 10px 32px;
      cursor: pointer;
      letter-spacing: 4px;
      text-transform: uppercase;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    #engage-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: #39ff14;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: -1;
    }

    #engage-btn:hover {
      color: #000;
      text-shadow: none;
    }

    #engage-btn:hover::before {
      opacity: 1;
    }

    #engage-btn.engaged {
      border-color: #ff3939;
      color: #ff3939;
      animation: pulse-red 1.5s infinite;
    }

    #engage-btn.engaged:hover {
      color: #000;
    }

    #engage-btn.engaged::before {
      background: #ff3939;
    }

    @keyframes pulse-red {
      0%, 100% { box-shadow: 0 0 5px rgba(255, 57, 57, 0.3); }
      50% { box-shadow: 0 0 25px rgba(255, 57, 57, 0.6); }
    }

    /* Title */
    #title {
      position: fixed;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-size: 12px;
      letter-spacing: 8px;
      color: rgba(57, 255, 20, 0.3);
      text-transform: uppercase;
      pointer-events: none;
      user-select: none;
    }

    /* Gravity indicator */
    #gravity-label {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-size: 10px;
      letter-spacing: 6px;
      color: rgba(255, 255, 255, 0.15);
      text-transform: uppercase;
      pointer-events: none;
      user-select: none;
      transition: color 0.5s;
    }

    /* SAVGENT easter egg message */
    #konami-msg {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100;
      font-size: 48px;
      font-weight: 700;
      color: #ffd700;
      letter-spacing: 4px;
      text-shadow:
        0 0 20px rgba(255, 215, 0, 0.8),
        0 0 60px rgba(255, 215, 0, 0.4),
        0 0 100px rgba(255, 215, 0, 0.2);
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
      text-align: center;
      line-height: 1.4;
    }

    #konami-msg.show {
      opacity: 1;
      animation: msg-glow 2s ease-in-out infinite alternate;
    }

    @keyframes msg-glow {
      from { text-shadow: 0 0 20px rgba(255, 215, 0, 0.8), 0 0 60px rgba(255, 215, 0, 0.4); }
      to { text-shadow: 0 0 40px rgba(255, 215, 0, 1), 0 0 100px rgba(255, 215, 0, 0.6), 0 0 150px rgba(255, 215, 0, 0.3); }
    }

    /* Scanline effect */
    #scanlines {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.08) 2px,
        rgba(0, 0, 0, 0.08) 4px
      );
    }

    /* Particle counter */
    #counter {
      position: fixed;
      top: 30px;
      right: 30px;
      z-index: 10;
      font-size: 10px;
      letter-spacing: 3px;
      color: rgba(57, 255, 20, 0.25);
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="scanlines"></div>

  <div id="title">SAVAGE PHYSICS</div>
  <div id="gravity-label">ANTIGRAVITY MODE</div>
  <div id="counter">BODIES: 0</div>

  <div id="konami-msg">You Are One 🦁</div>

  <div id="hud">
    <input
      id="text-input"
      type="text"
      placeholder="TYPE YOUR BURDEN . . ."
      autocomplete="off"
      spellcheck="false"
    />
    <button id="engage-btn">SAVAGE ENGAGE</button>
  </div>

  <script>
    // ─── Matter.js Aliases ───────────────────────────────────────
    const {
      Engine, Render, Runner, Bodies, Composite,
      Mouse, MouseConstraint, Events, Body
    } = Matter;

    // ─── Setup ───────────────────────────────────────────────────
    const container = document.getElementById('canvas-container');
    const W = window.innerWidth;
    const H = window.innerHeight;

    const engine = Engine.create();
    engine.world.gravity.y = 0; // Antigravity mode

    const render = Render.create({
      element: container,
      engine: engine,
      options: {
        width: W,
        height: H,
        wireframes: false,
        background: '#000000',
        pixelRatio: window.devicePixelRatio || 1
      }
    });

    Render.run(render);
    const runner = Runner.create();
    Runner.run(runner, engine);

    // ─── Invisible Walls ─────────────────────────────────────────
    const wallOpts = { isStatic: true, render: { visible: false } };
    const walls = [
      Bodies.rectangle(W / 2, H + 30, W + 100, 60, wallOpts),  // floor
      Bodies.rectangle(W / 2, -30, W + 100, 60, wallOpts),      // ceiling
      Bodies.rectangle(-30, H / 2, 60, H + 100, wallOpts),      // left
      Bodies.rectangle(W + 30, H / 2, 60, H + 100, wallOpts),   // right
    ];
    Composite.add(engine.world, walls);

    // ─── Mouse Constraint ────────────────────────────────────────
    const mouse = Mouse.create(render.canvas);
    const mouseConstraint = MouseConstraint.create(engine, {
      mouse: mouse,
      constraint: {
        stiffness: 0.2,
        render: {
          visible: true,
          lineWidth: 1,
          strokeStyle: '#39ff14'
        }
      }
    });
    Composite.add(engine.world, mouseConstraint);
    render.mouse = mouse;

    // Prevent mouse events from bubbling to input when dragging
    render.canvas.addEventListener('mousedown', (e) => {
      if (e.target === render.canvas) {
        // Allow canvas interactions
      }
    });

    // ─── State ───────────────────────────────────────────────────
    let bodyCount = 0;
    let gravityEngaged = false;
    let konamiTriggered = false;

    // ─── Create Text Texture ─────────────────────────────────────
    function createTextTexture(text, isGold = false) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');

      const fontSize = 22;
      ctx.font = `bold ${fontSize}px 'Courier New', monospace`;
      const metrics = ctx.measureText(text);

      const padding = 24;
      const w = Math.max(metrics.width + padding * 2, 80);
      const h = fontSize + padding * 2;

      canvas.width = w * 2;  // 2x for sharpness
      canvas.height = h * 2;

      ctx.scale(2, 2);

      // Background
      if (isGold) {
        const grad = ctx.createLinearGradient(0, 0, w, h);
        grad.addColorStop(0, '#ffd700');
        grad.addColorStop(0.5, '#ffec8b');
        grad.addColorStop(1, '#daa520');
        ctx.fillStyle = grad;
      } else {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
      }
      ctx.fillRect(0, 0, w, h);

      // Border
      ctx.strokeStyle = isGold ? '#ffd700' : '#39ff14';
      ctx.lineWidth = 2;
      ctx.strokeRect(1, 1, w - 2, h - 2);

      // Glow effect on border
      ctx.shadowColor = isGold ? '#ffd700' : '#39ff14';
      ctx.shadowBlur = 8;
      ctx.strokeRect(1, 1, w - 2, h - 2);
      ctx.shadowBlur = 0;

      // Text
      ctx.font = `bold ${fontSize}px 'Courier New', monospace`;
      ctx.fillStyle = isGold ? '#000' : '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Text glow
      if (!isGold) {
        ctx.shadowColor = '#39ff14';
        ctx.shadowBlur = 4;
      }
      ctx.fillText(text, w / 2, h / 2);

      return { dataUrl: canvas.toDataURL(), width: w, height: h };
    }

    // ─── Spawn Text Body ─────────────────────────────────────────
    function spawnTextBody(text, isGold = false) {
      const { dataUrl, width, height } = createTextTexture(text, isGold);

      const x = W / 2 + (Math.random() - 0.5) * 300;
      const y = H / 2 + (Math.random() - 0.5) * 200;

      const body = Bodies.rectangle(x, y, width, height, {
        restitution: 0.6,
        friction: 0.1,
        frictionAir: 0.01,
        render: {
          sprite: {
            texture: dataUrl,
            xScale: 0.5,
            yScale: 0.5
          }
        },
        label: text
      });

      // Give a random drift
      Body.setVelocity(body, {
        x: (Math.random() - 0.5) * 3,
        y: (Math.random() - 0.5) * 3
      });

      // Slight random spin
      Body.setAngularVelocity(body, (Math.random() - 0.5) * 0.05);

      Composite.add(engine.world, body);
      bodyCount++;
      document.getElementById('counter').textContent = `BODIES: ${bodyCount}`;

      return body;
    }

    // ─── SAVGENT Easter Egg ──────────────────────────────────────
    function triggerKonami(body) {
      konamiTriggered = true;

      // Reverse gravity — UP
      engine.world.gravity.y = -2;

      // Remove walls so things fly away
      Composite.remove(engine.world, walls[1]); // ceiling

      // Update labels
      const gravLabel = document.getElementById('gravity-label');
      gravLabel.textContent = '⚡ REVERSE GRAVITY ⚡';
      gravLabel.style.color = '#ffd700';

      // Show message
      setTimeout(() => {
        document.getElementById('konami-msg').classList.add('show');
      }, 800);

      // Screen flash
      document.body.style.transition = 'background 0.1s';
      document.body.style.background = '#ffd700';
      setTimeout(() => {
        document.body.style.background = '#000';
      }, 100);

      // Glitch all existing bodies slightly
      const allBodies = Composite.allBodies(engine.world);
      allBodies.forEach(b => {
        if (!b.isStatic) {
          Body.setVelocity(b, {
            x: (Math.random() - 0.5) * 10,
            y: -Math.random() * 8 - 3
          });
        }
      });
    }

    // ─── Input Handler ───────────────────────────────────────────
    const textInput = document.getElementById('text-input');

    textInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const text = textInput.value.trim().toUpperCase();
        if (!text) return;

        if (text === 'SAVGENT' && !konamiTriggered) {
          // Easter egg!
          const body = spawnTextBody(text, true);

          // Make it glow
          setTimeout(() => triggerKonami(body), 300);
        } else {
          spawnTextBody(text);
        }

        textInput.value = '';
      }
    });

    // ─── Engage Button ───────────────────────────────────────────
    const engageBtn = document.getElementById('engage-btn');

    engageBtn.addEventListener('click', () => {
      if (konamiTriggered) return; // Don't override konami

      gravityEngaged = !gravityEngaged;
      engine.world.gravity.y = gravityEngaged ? 1 : 0;

      engageBtn.textContent = gravityEngaged ? 'DISENGAGE' : 'SAVAGE ENGAGE';
      engageBtn.classList.toggle('engaged', gravityEngaged);

      const gravLabel = document.getElementById('gravity-label');
      gravLabel.textContent = gravityEngaged ? 'GRAVITY ENGAGED' : 'ANTIGRAVITY MODE';
      gravLabel.style.color = gravityEngaged
        ? 'rgba(255, 57, 57, 0.3)'
        : 'rgba(255, 255, 255, 0.15)';
    });

    // ─── Keep input focused but allow canvas interaction ─────────
    // Only refocus input when not dragging
    let isDragging = false;
    Events.on(mouseConstraint, 'startdrag', () => { isDragging = true; });
    Events.on(mouseConstraint, 'enddrag', () => {
      isDragging = false;
      // Don't steal focus back immediately
    });

    // ─── Ambient drift for zero-gravity bodies ───────────────────
    Events.on(engine, 'beforeUpdate', () => {
      if (engine.world.gravity.y === 0) {
        const allBodies = Composite.allBodies(engine.world);
        allBodies.forEach(body => {
          if (!body.isStatic) {
            // Gentle random drift
            const vx = body.velocity.x;
            const vy = body.velocity.y;
            const speed = Math.sqrt(vx * vx + vy * vy);

            if (speed < 0.3) {
              Body.setVelocity(body, {
                x: vx + (Math.random() - 0.5) * 0.2,
                y: vy + (Math.random() - 0.5) * 0.2
              });
            }
          }
        });
      }
    });

    // ─── Window Resize ───────────────────────────────────────────
    window.addEventListener('resize', () => {
      render.canvas.width = window.innerWidth;
      render.canvas.height = window.innerHeight;
      render.options.width = window.innerWidth;
      render.options.height = window.innerHeight;
    });

    // ─── Auto-focus input ────────────────────────────────────────
    textInput.focus();
  </script>
</body>
</html>
